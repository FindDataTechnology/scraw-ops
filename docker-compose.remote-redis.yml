# scraw-ops without local redis (uses the canonical fd-redis on guangzhou-xinru
# :30380, password-protected; LAN 192.168.1.4:6379 retired 2026-08-18)
services:
  scrapyd:
    build:
      context: .
      dockerfile: Dockerfile.scrapyd
    container_name: scraw-scrapyd
    volumes:
      - ./scrapyd.conf:/etc/scrapyd/scrapyd.conf:ro
      - scrapyd-eggs:/var/lib/scrapyd/eggs
      - scrapyd-logs:/var/lib/scrapyd/logs
      - scrapyd-dbs:/var/lib/scrapyd/dbs
    ports:
      - "6800:6800"
    environment:
      # Real password: guangzhou-xinru:/etc/fd-open-data/db-credentials.env.
      # Mac runs need the SSH tunnel (-L 30380) -> host.docker.internal in-container.
      REDIS_URL: "${REDIS_URL:-redis://:FD_REDIS_PASSWORD@host.docker.internal:30380/0}"
    restart: unless-stopped

  scrapydweb:
    build:
      context: .
      dockerfile: Dockerfile.scrapydweb
    container_name: scraw-scrapydweb
    volumes:
      - ./scrapydweb_settings.py:/app/scrapydweb_settings.py:ro
    ports:
      - "5001:5000"
    depends_on:
      - scrapyd
    restart: unless-stopped

volumes:
  scrapyd-eggs:
  scrapyd-logs:
  scrapyd-dbs:
