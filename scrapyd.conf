# scrapyd configuration for the shared scraw-ops service.
# Docs: https://scrapyd.readthedocs.io/en/stable/config.html
[scrapyd]
eggs_dir     = /var/lib/scrapyd/eggs
logs_dir     = /var/lib/scrapyd/logs
items_dir    =
dbs_dir      = /var/lib/scrapyd/dbs
jobs_to_keep = 10
dbs_to_keep  = 5
max_proc     = 4
http_port    = 6800
bind_address = 0.0.0.0
debug        = off
